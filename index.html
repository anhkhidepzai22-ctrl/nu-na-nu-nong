<!DOCTYPE html>
<html lang="vi"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Âm Nhạc Remix TikTok 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        header h1 {
            font-size: 2rem;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            margin-bottom: 8px;
        }

        header p {
            color: #a0a0a0;
            font-size: 1rem;
        }

        .player-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .info-section {
            margin-top: 20px;
        }

        .info-section h2 {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .channel-name {
            display: inline-block;
            background: #ff0050;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-play {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: linear-gradient(45deg, #ff0050, #00d2ff);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            transition: transform 0.2s;
        }

        .btn-play:hover {
            transform: scale(1.05);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: #777;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎵 Music World 2026</h1>
        <p>Thưởng thức những bản nhạc Remix TikTok triệu view hot nhất</p>
    </header>

    <div class="player-container">
        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube-nocookie.com/embed/f9Jrrjezck8" 
                title="NHẠC REMIX TIKTOK TRIỆU VIEW" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>

        <div class="info-section">
            <h2>NHẠC REMIX TIKTOK TRIỆU VIEW - Top 20 Nhạc TikTok Hay 2026</h2>
            <span class="channel-name">Kênh: H2O Remix</span>
            <p style="color: #aaa; margin-top: 5px;">Nếu trình phát gặp lỗi chặn từ YouTube, bấm nút bên dưới để phát trực tiếp:</p>
            <a href="https://youtu.be/f9Jrrjezck8" target="_blank" class="btn-play">▶ Mở Xem Trên YouTube</a>
        </div>
    </div>

    <footer>
        <p>© 2026 Âm Nhạc Giải Trí</p>
    </footer>

</body>
</html>
